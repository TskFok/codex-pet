[package]
name = "pet-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pet_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
pet-core = { path = "../../../crates/pet-core" }
pet-bridge = { path = "../../../crates/pet-bridge" }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
notify = "=8.2.0"
subtle = "=2.6.1"
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time", "macros"] }
tauri-plugin-autostart = { version = "2", default-features = false }
rfd = { version = "0.16.0", default-features = false }
uuid = { version = "1", default-features = false, features = ["v4"] }
base64 = "0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy"] }

[dev-dependencies]
tempfile = "3.26.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSView", "NSVisualEffectView", "NSResponder", "NSColor", "NSScreen", "NSApplication", "NSGraphics", "NSWorkspace", "NSPasteboard", "objc2-quartz-core"] }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSString", "NSBundle", "NSURL"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer"] }
