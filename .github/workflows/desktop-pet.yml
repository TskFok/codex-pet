name: 桌宠检查与构建

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm --filter @codex-pet/desktop tauri build --debug --no-bundle --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-${{ matrix.target }}-debug
          path: |
            target/${{ matrix.target }}/debug/pet-desktop
            target/${{ matrix.target }}/debug/pet-desktop.exe
          if-no-files-found: error
